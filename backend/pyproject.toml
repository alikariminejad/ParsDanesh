[project]
name = "backend"
version = "0.1.0"
description = "Persian RAG & Knowledge Platform"
readme = "README.md"
authors = [
    { name = "Ali Kariminejad", email = "kariminejad.ali.ak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django==5.2.17",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]
